version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  ignore:
  # json 3.x ломает ActiveSupport 8.1: JSON.parse вызывается с двумя аргументами.
  - dependency-name: json
    versions: [ ">= 3.0" ]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
